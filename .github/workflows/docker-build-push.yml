name: Build, Scan, and Push Docker Image

on:
  push:
    branches:
      - main 

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd 

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t smartaquarius10/kubelogin:latest .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: 'smartaquarius10/kubelogin:latest'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'  # Fails pipeline if vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Scan for secrets (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: 'smartaquarius10/kubelogin:latest'
          scanners: 'secret'
          exit-code: '1'

      - name: Malware scan (ClamAV)
        run: |
          docker save smartaquarius10/kubelogin:latest -o /tmp/image.tar
          mkdir -p /tmp/unpacked && tar -xf /tmp/image.tar -C /tmp/unpacked
          docker run --rm -v /tmp/unpacked:/scan clamav/clamav:latest \
            clamscan -r --infected --no-summary /scan
            
      - name: Push Docker Image to Docker Hub
        if: success()  # Only push if Trivy scan is successful
        run: |
          docker push smartaquarius10/kubelogin:latest
